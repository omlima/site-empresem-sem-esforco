server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /downloads {
        return 301 /downloads/;
    }

    location = /downloads/ {
        try_files /downloads/index.html =404;
    }

    location /assets/downloads/ {
        types { }
        default_type text/markdown;
        charset utf-8;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
